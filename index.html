<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5ea8">
  <meta name="color-scheme" content="light dark">
  <title>RAPIH1900</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lapor.css">
</head>
<body>
  <header class="topbar">
    <img id="logoApp" class="logoapp" alt="" hidden>
    <div class="judulbox"><h1 id="judul">RAPIH1900</h1><small id="subjudul"></small></div>
  </header>

  <!-- Logo BPS (ketuk = masuk admin) -->
  <div class="brandbar">
    <button id="logoBtn" class="logo" title="Admin"><picture><source media="(min-width: 900px), (prefers-color-scheme: dark)" srcset="logobpsw.png"><img id="logoImg" alt="BPS"></picture><span id="logoTeks" hidden>BPS</span></button>
  </div>

  <!-- Menu utama -->
  <nav class="menu">
    <button type="button" data-v="harian" class="active">✅ Ceklis Harian</button>
    <button type="button" data-v="lapor">🛠 Lapor Kerusakan</button>
  </nav>

  <main>
    <!-- Halaman PPPK -->
    <div id="v-harian">
      <section class="card pilih">
        <label>Nama <select id="selNama"></select></label>
        <label>Tanggal <input type="date" id="selTanggal"></label>
      </section>
      <div id="pesan" class="pesan"></div>
      <nav id="tabArea" class="tabarea"></nav>
      <section id="panel" hidden>
        <div class="statusbar"><b id="pgs"></b><span id="simpanStatus"></span></div>
        <label class="check libur"><span>Libur (X)</span><input type="checkbox" id="chkLibur"></label>
        <div id="daftar" class="daftar"></div>
        <div class="card foto">
          <b>Foto bukti</b>
          <div class="fotoaksi">
            <label class="btnfoto">📷 Kamera<input type="file" id="inKamera" accept="image/*" capture="environment" hidden></label>
            <label class="btnfoto alt">🖼 Galeri / File<input type="file" id="inFoto" accept="image/*" hidden></label>
          </div>
          <div id="fotoList" class="fotolist"></div>
        </div>
      </section>
    </div>

    <!-- Halaman Lapor Kerusakan (diisi oleh lapor.js) -->
    <div id="v-lapor" hidden></div>
  </main>

  <!-- Dialog password admin -->
  <dialog id="dlgLogin">
    <form method="dialog" id="formLogin">
      <h3>Masuk Admin</h3>
      <input type="password" id="adminPass" placeholder="Password admin" autocomplete="current-password">
      <div id="loginErr" class="err"></div>
      <div class="baris"><button type="button" id="loginBatal" class="ghost">Batal</button><button class="primary">Masuk</button></div>
    </form>
  </dialog>

  <!-- Panel admin -->
  <div id="admin" class="admin" hidden>
    <div class="adminbar"><b>Admin RAPIH1900</b><button id="adminTutup" class="ghost">✕ Tutup</button></div>
    <nav class="admintabs">
      <button data-at="petugas" class="active">Petugas</button>
      <button data-at="tugas">Tugas</button>
      <button data-at="laporan">Laporan</button>
      <button data-at="pejabat">Pejabat TTD</button>
      <button data-at="unduh">Unduh Excel</button>
    </nav>
    <div class="adminbody">
      <section id="at-petugas"></section>
      <section id="at-tugas" hidden></section>
      <section id="at-laporan" hidden></section>
      <section id="at-pejabat" hidden></section>
      <section id="at-unduh" hidden></section>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="excel.js"></script>
  <script src="lapor.js"></script>
  <script src="admin.js"></script>
  <script>
    // foto dari kamera -> diteruskan ke handler yang sama dengan Galeri/File
    document.getElementById('inKamera').addEventListener('change', function () {
      var tujuan = document.getElementById('inFoto');
      if (!this.files.length) return;
      tujuan.files = this.files;
      tujuan.dispatchEvent(new Event('change'));
      this.value = '';
    });
  </script>
</body>
</html>
